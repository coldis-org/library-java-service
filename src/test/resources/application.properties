
# Logging.
#logging.level.org.springframework=DEBUG
logging.level.org.coldis.library=DEBUG
#logging.level.org.apache.activemq.artemis=DEBUG
logging.level.org.springframework.transaction=TRACE
logging.level.org.springframework.orm.jpa=TRACE

# Application.
spring.application.name=service

# Coldis.
org.coldis.configuration.default-enabled=true
org.coldis.configuration.aspectj-enabled=true
org.coldis.configuration.service.batch-enabled=true
org.coldis.configuration.service.statistics-enabled=true
org.coldis.configuration.base-package=org.coldis
org.coldis.configuration.persistence.jpa.base-package=noop
org.coldis.library.service.jms.session-attributes=testJmsAttr1,testJmsAttr2,testJmsAttr3,testJmsAttr4,testJmsAttr5,testJmsAttr6

# Datasource.
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_CONTAINER_5432}/test
spring.datasource.username=test
spring.datasource.password=test
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# JMS.
spring.artemis.broker-url=tcp://localhost:${ARTEMIS_CONTAINER_61616}?${spring.artemis.broker-url-query-default}
spring.artemis.user=test
spring.artemis.password=test

# Redis.
spring.data.redis.host=localhost
spring.data.redis.port=${REDIS_CONTAINER_6379}

# Test.
spring.test.context.failure.threshold=1000000

# Properties.
org.coldis.library.test.data-installer-attribute=33
org.coldis.library.service-client.timeout=300
test.properties.property1=1
test.properties.property2=1
test.properties.property3=1
test.properties.property4=1
test.properties.property5=1
test.properties.property6=true



# Cold storage tiering: every switch on, local-folder storage under a fresh target/ directory,
# schema created from the entities, no cron (the tests drive the batches and register a schedule
# themselves), one definition disabled and one without cold reads by property.
org.coldis.configuration.service.cold-tiering-enabled=true
org.coldis.library.service.tiering.storage=folder
org.coldis.library.service.tiering.folder.root=target/cold-tiering-${random.uuid}
org.coldis.library.service.tiering.create-schema=true
# One consumer per archive queue: the duplicate-request test relies on single-consumer ordering
# (the duplicate, then a barrier key, taken in order).
org.coldis.library.service.tiering.upload.concurrency=1
org.coldis.library.service.tiering.backfill.concurrency=1
org.coldis.library.service.tiering.defaults.enabled=true
org.coldis.library.service.tiering.defaults.cold-read-enabled=true
org.coldis.library.service.tiering.defaults.eviction.enabled=true
org.coldis.library.service.tiering.defaults.eviction.cron=-
org.coldis.library.service.tiering.defaults.eviction.delay-between-chunks=PT0.2S
org.coldis.library.service.tiering.defaults.backfill.enabled=true
org.coldis.library.service.tiering.defaults.backfill.cron=-
org.coldis.library.service.tiering.defaults.backfill.chunk-size=2
org.coldis.library.service.tiering.defaults.backfill.delay-between-chunks=PT0.2S
org.coldis.library.service.tiering.table.tiered-archive-entry.rehydration=NONE
org.coldis.library.service.tiering.table.tiered-archive-entry.ttl=P1D
org.coldis.library.service.tiering.table.tiered-archive-entry.safety-margin=PT0S
org.coldis.library.service.tiering.table.tiered-archive-entry-disabled.enabled=false
org.coldis.library.service.tiering.table.tiered-archive-entry-no-cold-read.cold-read-enabled=false
# (The monthly table schedules its export and sweep on a date that never comes round during a run,
# so the registration decision is observable.)
# The row-tiered snapshot table has the partition batches enabled and scheduled too: the code's
# split by archive unit, not the properties, keeps them off it.
org.coldis.library.service.tiering.table.tiered-snapshot.export.enabled=true
org.coldis.library.service.tiering.table.tiered-snapshot.export.cron=0 0 0 29 2 *
org.coldis.library.service.tiering.table.tiered-snapshot.partition-sweep.enabled=true
org.coldis.library.service.tiering.table.tiered-snapshot.partition-sweep.cron=0 0 0 29 2 *
# A row-tiered table with its own object key prefix.
org.coldis.library.service.tiering.table.tiered-event.prefix=cold-tiering-events/
# Partition tiering test table: tiny blocks and pages so a few dozen rows make several shards and
# blocks; hold and TTL of one hour; two export listeners; no backfill (rejected on partition
# tables); the backfill batch is enabled by the defaults and the code keeps it off a partition table.
org.coldis.library.service.tiering.export.concurrency=2
org.coldis.library.service.tiering.table.tiered-monthly-snapshot.prefix=cold-tiering-full/
org.coldis.library.service.tiering.table.tiered-monthly-snapshot.ttl=PT1H
org.coldis.library.service.tiering.table.tiered-monthly-snapshot.safety-margin=PT0S
org.coldis.library.service.tiering.table.tiered-monthly-snapshot.touch-threshold=PT1M
org.coldis.library.service.tiering.table.tiered-monthly-snapshot.backfill.cron=0 0 0 29 2 *
org.coldis.library.service.tiering.table.tiered-monthly-snapshot.export.enabled=true
org.coldis.library.service.tiering.table.tiered-monthly-snapshot.export.cron=0 0 0 29 2 *
org.coldis.library.service.tiering.table.tiered-monthly-snapshot.export.delay-between-chunks=PT0.2S
org.coldis.library.service.tiering.table.tiered-monthly-snapshot.export.shards=8
org.coldis.library.service.tiering.table.tiered-monthly-snapshot.export.block-size=256
org.coldis.library.service.tiering.table.tiered-monthly-snapshot.export.page-size=5
org.coldis.library.service.tiering.table.tiered-monthly-snapshot.export.key-page-size=7
org.coldis.library.service.tiering.table.tiered-monthly-snapshot.export.part-size=1024
org.coldis.library.service.tiering.table.tiered-monthly-snapshot.export.verify-sample-every=3
org.coldis.library.service.tiering.table.tiered-monthly-snapshot.partition-sweep.enabled=true
org.coldis.library.service.tiering.table.tiered-monthly-snapshot.partition-sweep.cron=0 0 0 29 2 *
org.coldis.library.service.tiering.table.tiered-monthly-snapshot.partition-sweep.chunk-size=2
org.coldis.library.service.tiering.table.tiered-monthly-snapshot.partition-sweep.delay-between-chunks=PT0.2S
org.coldis.library.service.tiering.table.tiered-monthly-snapshot.partition-sweep.hold-after-load=PT1H
