
# Environment.
environment=${ENVIRONMENT:development}

# Application.
server.port=9090
server.context-path=

# Default configuration.
org.coldis.configuration.base-package=
org.coldis.configuration.default-enabled=true
org.coldis.configuration.aspectj-enabled=true
org.coldis.configuration.data-installer-enabled=true
org.coldis.configuration.data-installer=/install/data
org.coldis.configuration.data-installer-ignore=
org.coldis.configuration.health-check=/health-check

# Service warm-up (doc/service-warm-up.md). Off by default: until a service sets enabled=true in its
# own properties, none of the warm-up beans, filters or guards is registered. When on, the
# service's ServiceWarmUp beans run at start and hold the health check (503) until they stop:
# when the JIT compiles under idle-compilation-millis-per-second for idle-compilation-period after
# every warm-up made minimum-calls, at time-limit, or when the inputs end. Keep time-limit well
# under the orchestrator's health check grace. Parallelism 0 means one thread per processor.
org.coldis.library.service.warm-up.enabled=false
org.coldis.library.service.warm-up.time-limit=60s
org.coldis.library.service.warm-up.minimum-calls=500
org.coldis.library.service.warm-up.parallelism=0
org.coldis.library.service.warm-up.idle-compilation-millis-per-second=100
org.coldis.library.service.warm-up.idle-compilation-period=3s
org.coldis.library.service.warm-up.maximum-consecutive-errors=20

# Security.
org.coldis.library.service.security.swagger.paths-regex=/webjars/.*,/v2/api-docs.*,/swagger.*
org.coldis.library.service.security.actuator.paths-regex=/actuator.*
org.coldis.library.service.security.ignored-regex-default=${org.coldis.configuration.data-installer:/install/data},${org.coldis.configuration.health-check:/health-check},/properties/.*,${org.coldis.library.service.security.swagger.paths-regex},${org.coldis.library.service.security.actuator.paths-regex}
org.coldis.library.service.security.ignore-non-browser-requests-paths=${org.coldis.library.service.security.ignored-regex-default}
org.coldis.library.service.security.ignore-mandatory-headers-paths=${org.coldis.library.service.security.ignored-regex-default}

# JMS listener threads.
org.coldis.library.service.jms.listener.concurrency.shortest=1
org.coldis.library.service.jms.listener.concurrency.shorter=1-5
org.coldis.library.service.jms.listener.concurrency.short=1-10
org.coldis.library.service.jms.listener.concurrency.regular=1-20
org.coldis.library.service.jms.listener.concurrency.high=1-40
org.coldis.library.service.jms.listener.concurrency.higher=1-70
org.coldis.library.service.jms.listener.concurrency.highest=1-110

# JMS converter configuration.
org.coldis.library.service.jms.message-converter-enhanced.enabled=true
org.coldis.library.service.jms.message-converter-enhanced.object-mapper=thinJsonMapper
org.coldis.library.service.jms.maximum-async-hops=50
org.coldis.library.service.jms.maximum-async-hops-ignored-for.batch-delete=true
org.coldis.library.service.jms.maximum-async-hops-ignored-for.batch-resume=true
org.coldis.library.service.jms.non-retriable-exceptions=java.lang.IllegalArgumentException,jakarta.validation.ConstraintViolationException

# Stale message filter (consumer-side last-value semantics for refresh-style
# messages). Disabled by default: services opt in. Only messages carrying a
# stale filter key are affected.
org.coldis.library.service.jms.stale-filter.enabled=false
org.coldis.library.service.jms.stale-filter.window=1h
org.coldis.library.service.jms.stale-filter.synchronization-interval=10s
org.coldis.library.service.jms.stale-filter.clock-skew-margin=1s
org.coldis.library.service.jms.stale-filter.persistence-enabled=true
org.coldis.library.service.jms.stale-filter.create-schema=true
org.coldis.library.service.jms.stale-filter.table-name=stale_message_filter
org.coldis.library.service.jms.stale-filter.initial-capacity=4096

# Spring AOP.
spring.aop=false
spring.aop.auto=false

# Transaction configuration.
org.coldis.library.service.transaction.shortest-timeout=1
org.coldis.library.service.transaction.shorter-timeout=2
org.coldis.library.service.transaction.short-timeout=3
org.coldis.library.service.transaction.regular-timeout=5
org.coldis.library.service.transaction.long-timeout=13
org.coldis.library.service.transaction.longer-timeout=30
org.coldis.library.service.transaction.longest-timeout=200
org.coldis.library.service.transaction.minutes-timeout=600
org.coldis.library.service.transaction.hour-timeout=3600
org.coldis.library.service.transaction.hours-timeout=10800
spring.transaction.default-timeout=${org.coldis.library.service.transaction.regular-timeout:5}

# JMS/Artemis.
spring.jms.cache.enabled=false
spring.artemis.broker-url-query-default=remotingThreads=${AVAILABLE_CPUS_30X:100};useEpoll=false;directDeliver=false;tcpNoDelay=true;batchDelay=0;tcpSendBufferSize=-1;tcpReceiveBufferSize=-1;writeBufferLowWaterMark=65536;writeBufferHighWaterMark=8388608;useTopologyForLoadBalancing=false;
spring.artemis.mode=native
spring.artemis.use-global-pools=true
spring.artemis.cache-destinations=true
spring.artemis.cache-large-messages-client=false
spring.artemis.compress-large-message=false
spring.artemis.compression-level=-1
spring.artemis.consumer-max-rate=-1
spring.artemis.producer-window-size=65536
spring.artemis.producer-max-rate=-1
spring.artemis.confirmation-window-size=1048576
spring.artemis.ack-batch-size=65536
spring.artemis.dups-ack-batch-size=131072
spring.artemis.block-on-acknowledge=false
spring.artemis.block-on-durable-send=true
spring.artemis.block-on-non-durable-send=false
spring.artemis.client-failure-check-period=20000
spring.artemis.connection-ttl=120000
spring.artemis.call-timeout=20000
spring.artemis.call-failover-timeout=10000
spring.artemis.reconnect-attempts=-1
spring.artemis.retry-interval=3000
spring.artemis.retry-interval-multiplier=1.5
spring.artemis.max-messages-per-task=10
spring.artemis.backoff-initial-interval=3000
spring.artemis.backoff-multiplier=1
spring.artemis.backoff-max-elapsed-time=9223372036854775807
spring.artemis.cache-level=3
spring.artemis.embedded.enabled=false
spring.artemis.pool.enabled=true
spring.artemis.pool.idle-timeout=60s
spring.artemis.pool.max-connections=16
spring.artemis.pool.max-sessions-per-connection=500
spring.artemis.pool.block-if-full=true
spring.artemis.pool.block-if-full-timeout=-1
spring.artemis.pool.time-between-expiration-check=60s
spring.artemis.pool.use-anonymous-producers=true

# Dynamic consumer credit scaling enabled by default. The scaling signal is each
# consumer's fair share of the backlog (depth / consumers on the queue): above the
# threshold the consumer's prefetch window grows with its share (up to max-credits,
# a per-consumer cap) so deep queues drain with larger batches; at or below it
# credits pass through unchanged (one message at a time, fair distribution), and
# over-inflated windows decay back once the backlog shrinks.
# Each value can be overridden by an env var.
spring.artemis.consumer-window-size=0
spring.artemis.dynamic-credits-depth-threshold=200
spring.artemis.dynamic-credits-multiplier=2.0
spring.artemis.dynamic-credits-max-credits=131072
spring.artemis.dynamic-credits-cache-ttl=5000

# Log.
logging.config-timeout=classpath:logback-spring.xml
logging.file.max-history=10
logging.file.max-size=250MB
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.org.coldis=INFO

# Tomcat.
server.max-http-request-header-size=256KB
server.tomcat.acceptor-thread-priority=5
server.tomcat.use-virtual-threads=false
server.tomcat.max-swallow-size=5MB
server.tomcat.max-http-form-post-size=5MB
server.tomcat.mbeanregistry.enabled=true
server.tomcat.connection-timeout=20s
server.tomcat.keep-alive-timeout=20s
server.tomcat.max-keep-alive-requests=4096
server.tomcat.accept-count=8192
server.tomcat.max-connections=16384
server.tomcat.threads.min-spare=${AVAILABLE_CPUS_1X:8}
server.tomcat.threads.max=${AVAILABLE_CPUS_5X:16}
# Floor for the default server.tomcat.threads.max above: when the cap comes from this file, a
# value below the floor is raised to it. A cap the service sets itself (in its own properties or
# as SERVER_TOMCAT_THREADS_MAX) is used as is. Requests mostly wait on the database and on other
# services, so with only a few threads a slow dependency holds them all, and the health check
# and the /properties updates queue behind it. 0 turns the floor off.
org.coldis.library.service.tomcat.threads.max-floor=20
server.tomcat.processor-cache=20000

# Data cache.
org.coldis.configuration.cache.millis-expiration=3100
org.coldis.configuration.cache.seconds-expiration=23
org.coldis.configuration.cache.minutes-expiration=11
org.coldis.configuration.cache.hours-expiration=3
org.coldis.configuration.cache.day-expiration=1
org.coldis.configuration.cache.days-expiration=5

# Virtual threads.
spring.threads.virtual.enabled=false

# Lazy initialization and keep alive.
spring.main.lazy-initialization=false
spring.main.keep-alive=true

# Actuator.
management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=env,beans

# OpenAPI. Disabled by default.
springdoc.swagger-ui.enabled=false

# File.
org.coldis.configuration.file.date.suffix=yyyyMMddHHmmss

# Jackson.
spring.jackson.mapper.default-view-inclusion=true
spring.jackson.mapper.require-type-id-for-subtypes=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.use-big-decimal-for-floats=true
spring.jackson.deserialization.accept-single-value-as-array=true
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.fail-on-ignored-properties=false
spring.jackson.deserialization.read-unknown-enum-values-as-null=true
spring.jackson.time-zone=America/Sao_Paulo

# Number.
org.coldis.configuration.number.calculation-scale=34
org.coldis.configuration.number.rate-scale=4
org.coldis.configuration.number.currency-scale=2
org.coldis.configuration.number.rounding-mode=HALF_DOWN

# Logs.
spring.output.ansi.enabled=never

# Static resources.
org.coldis.configuration.resources.static.cache=30d


# Cold storage tiering (doc/cold-storage-tiering.md). Off unless
# org.coldis.configuration.service.cold-tiering-enabled=true; every table starts disabled.
org.coldis.library.service.tiering.storage=s3
org.coldis.library.service.tiering.folder.root=${java.io.tmpdir}/cold-tiering
org.coldis.library.service.tiering.create-schema=false
org.coldis.library.service.tiering.prefix=cold-tiering/
org.coldis.library.service.tiering.payload-codec=gzip-json
org.coldis.library.service.tiering.object-key-strategy=path
org.coldis.library.service.tiering.upload.concurrency=1
org.coldis.library.service.tiering.backfill.concurrency=1
org.coldis.library.service.tiering.touch.concurrency=1-2
org.coldis.library.service.tiering.defaults.enabled=false
org.coldis.library.service.tiering.defaults.ttl=P15D
org.coldis.library.service.tiering.defaults.touch-threshold=P1D
org.coldis.library.service.tiering.defaults.safety-margin=P2D
org.coldis.library.service.tiering.defaults.cold-read-enabled=false
org.coldis.library.service.tiering.defaults.eviction.enabled=false
org.coldis.library.service.tiering.defaults.eviction.cron=0 0 * * * *
org.coldis.library.service.tiering.defaults.eviction.chunk-size=2000
org.coldis.library.service.tiering.defaults.eviction.delay-between-chunks=PT2S
org.coldis.library.service.tiering.defaults.eviction.finish-within=P1D
org.coldis.library.service.tiering.defaults.backfill.enabled=false
org.coldis.library.service.tiering.defaults.backfill.cron=0 30 * * * *
org.coldis.library.service.tiering.defaults.backfill.chunk-size=1000
org.coldis.library.service.tiering.defaults.backfill.delay-between-chunks=PT30S
org.coldis.library.service.tiering.defaults.backfill.finish-within=P1D
org.coldis.library.service.tiering.defaults.backfill.max-pending=10000
# Partition tiering (doc/cold-storage-sharded-tiering.md): export of leaf partitions as sharded
# objects, heap-order sweep after the hold. gzip blocks (the only built-in BlockCodec); one export
# listener; ~10 MB/s of WAL for the sweep.
org.coldis.library.service.tiering.block-codec=gzip
org.coldis.library.service.tiering.export.concurrency=1
org.coldis.library.service.tiering.index-cache.ttl=PT5M
org.coldis.library.service.tiering.defaults.export.enabled=false
org.coldis.library.service.tiering.defaults.export.cron=0 15 * * * *
org.coldis.library.service.tiering.defaults.export.delay-between-chunks=PT2S
org.coldis.library.service.tiering.defaults.export.finish-within=P2D
org.coldis.library.service.tiering.defaults.export.max-pending=10000
org.coldis.library.service.tiering.defaults.export.quiet-period=P2D
org.coldis.library.service.tiering.defaults.export.exclude-partitions=*_legacy
org.coldis.library.service.tiering.defaults.export.shard-strategy=EQUI_DEPTH
org.coldis.library.service.tiering.defaults.export.shards=1000
org.coldis.library.service.tiering.defaults.export.shard-digits=3
org.coldis.library.service.tiering.defaults.export.block-size=1048576
org.coldis.library.service.tiering.defaults.export.page-size=2000
org.coldis.library.service.tiering.defaults.export.key-page-size=1000000
org.coldis.library.service.tiering.defaults.export.part-size=16777216
org.coldis.library.service.tiering.defaults.export.verify-sample-every=50000
org.coldis.library.service.tiering.defaults.partition-sweep.enabled=false
org.coldis.library.service.tiering.defaults.partition-sweep.cron=0 0 22 * * *
org.coldis.library.service.tiering.defaults.partition-sweep.chunk-size=1024
org.coldis.library.service.tiering.defaults.partition-sweep.delay-between-chunks=PT1S
org.coldis.library.service.tiering.defaults.partition-sweep.finish-within=P3D
org.coldis.library.service.tiering.defaults.partition-sweep.hold-after-load=P5D
