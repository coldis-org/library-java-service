
# Environment.
environment=${ENVIRONMENT:development}

# Application.
server.port=9090
server.context-path=

# Default configuration.
org.coldis.configuration.base-package=
org.coldis.configuration.default-enabled=true
org.coldis.configuration.aspectj-enabled=true
org.coldis.configuration.data-installer-enabled=true
org.coldis.configuration.data-installer=/install/data
org.coldis.configuration.data-installer-ignore=
org.coldis.configuration.health-check=/health-check
# The health check answers 503 while the application does not accept traffic: from the start until
# Spring declares it ready (after the startup runners), and again once shutdown begins. Consul and
# the load balancers then route to an instance only when it can serve, and stop routing before it
# goes away.
org.coldis.configuration.health-check-readiness-enabled=true
# /health-check?scope=liveness answers whether the instance is alive (for restart checks), never from
# readiness or dependencies: 503 once Spring marks liveness broken, or once the repository read of
# the routing check has failed continuously for longer than the limit (0 turns it off). The routing
# check (/health-check) supplies that evidence, so it must keep being polled: a failure counts as
# continuing only while the last one is more recent than the recency. If the database is shared and
# down for every instance, all of them reach the limit together; set 0 where a restart cannot help.
org.coldis.configuration.health-check-liveness-repository-failure-limit=15m
org.coldis.configuration.health-check-liveness-repository-failure-recency=2m

# Graceful shutdown: on the stop signal, finish the requests in flight before stopping. Spring Boot's
# default since 3.4, set here so a version change cannot turn it off silently. The deploy
# orchestrator must wait longer than this phase before killing the process.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_PHASE_TIMEOUT:25s}

# Service warm-up (doc/service-warm-up.md). Off by default: until a service sets enabled=true in its
# own properties, none of the warm-up beans, filters or guards is registered. read-only-transaction
# (default true) keeps the database guard: each call in a read-only transaction that is rolled back;
# false runs the calls with no transaction of the warm-up's, so they can write. When on, the
# service's ServiceWarmUp beans run at start and hold the health check (503) until they stop:
# when the JIT compiles under idle-compilation-millis-per-second for idle-compilation-period after
# every warm-up made minimum-calls, at time-limit, or when the inputs end. Keep time-limit well
# under the orchestrator's health check grace. Parallelism 0 means one thread per processor.
org.coldis.library.service.warm-up.enabled=false
org.coldis.library.service.warm-up.read-only-transaction=true
org.coldis.library.service.warm-up.time-limit=60s
org.coldis.library.service.warm-up.minimum-calls=500
org.coldis.library.service.warm-up.parallelism=0
org.coldis.library.service.warm-up.idle-compilation-millis-per-second=100
org.coldis.library.service.warm-up.idle-compilation-period=3s
org.coldis.library.service.warm-up.maximum-consecutive-errors=20

# Security.
org.coldis.library.service.security.swagger.paths-regex=/webjars/.*,/v2/api-docs.*,/swagger.*
org.coldis.library.service.security.actuator.paths-regex=/actuator.*
org.coldis.library.service.security.ignored-regex-default=${org.coldis.configuration.data-installer:/install/data},${org.coldis.configuration.health-check:/health-check},/properties/.*,${org.coldis.library.service.security.swagger.paths-regex},${org.coldis.library.service.security.actuator.paths-regex}
org.coldis.library.service.security.ignore-non-browser-requests-paths=${org.coldis.library.service.security.ignored-regex-default}
org.coldis.library.service.security.ignore-mandatory-headers-paths=${org.coldis.library.service.security.ignored-regex-default}

# JMS listener threads.
org.coldis.library.service.jms.listener.concurrency.shortest=1
org.coldis.library.service.jms.listener.concurrency.shorter=1-5
org.coldis.library.service.jms.listener.concurrency.short=1-10
org.coldis.library.service.jms.listener.concurrency.regular=1-20
org.coldis.library.service.jms.listener.concurrency.high=1-40
org.coldis.library.service.jms.listener.concurrency.higher=1-70
org.coldis.library.service.jms.listener.concurrency.highest=1-110

# JMS listener executor. By default one fixed pool of 20 threads per processor polls for every listener
# container. org.coldis.library.service.jms.listener.executor.concurrency and concurrency-cpu-multiplier
# are legacy and should not be set: they limit polling consumers, not handlers, and a consumer that has to
# start or resubmit another consumer waits for a slot while holding its own, so listeners can stop
# processing until a restart. To bound concurrent handlers, use the bulkhead below.
# unbounded=true removes the thread cap (a consumer thread exists per polling consumer); it follows the
# bulkhead switch, because consumers waiting for a permit hold their threads.
org.coldis.library.service.jms.listener.executor.unbounded=${org.coldis.library.service.jms.listener.bulkhead.enabled:false}

# JMS listener bulkhead (doc/jms-listener-bulkhead.md). Off by default. On, at most max-in-flight handlers
# run at once in this instance; consumers that received a message wait in arrival order for a permit and
# idle queues hold none. max-in-flight-cpu-multiplier (permits per processor) wins over max-in-flight;
# with neither, the default group is not limited. max-wait unset waits until a permit or until the
# container stops; set, a timeout rolls the message back to the broker, which counts as a delivery
# attempt, so it only applies to the first max-wait-deliveries deliveries of a message.
org.coldis.library.service.jms.listener.bulkhead.enabled=false
#org.coldis.library.service.jms.listener.bulkhead.max-in-flight=
#org.coldis.library.service.jms.listener.bulkhead.max-in-flight-cpu-multiplier=
#org.coldis.library.service.jms.listener.bulkhead.max-wait=
org.coldis.library.service.jms.listener.bulkhead.max-wait-deliveries=3
#org.coldis.library.service.jms.listener.bulkhead.reserved.<name>.permits=
#org.coldis.library.service.jms.listener.bulkhead.reserved.<name>.destinations=
#org.coldis.library.service.jms.listener.bulkhead.reserved.<name>.factories=
#org.coldis.library.service.jms.listener.bulkhead.groups.<group>.factories=
#org.coldis.library.service.jms.listener.bulkhead.groups.<group>.max-in-flight=

# JMS converter configuration.
org.coldis.library.service.jms.message-converter-enhanced.enabled=true
org.coldis.library.service.jms.message-converter-enhanced.object-mapper=thinJsonMapper
org.coldis.library.service.jms.maximum-async-hops=50
org.coldis.library.service.jms.maximum-async-hops-ignored-for.batch-delete=true
org.coldis.library.service.jms.maximum-async-hops-ignored-for.batch-resume=true
org.coldis.library.service.jms.non-retriable-exceptions=java.lang.IllegalArgumentException,jakarta.validation.ConstraintViolationException

# Stale message filter (consumer-side last-value semantics for refresh-style
# messages). Disabled by default: services opt in. Only messages carrying a
# stale filter key are affected.
org.coldis.library.service.jms.stale-filter.enabled=false
org.coldis.library.service.jms.stale-filter.window=1h
org.coldis.library.service.jms.stale-filter.synchronization-interval=10s
org.coldis.library.service.jms.stale-filter.clock-skew-margin=1s
org.coldis.library.service.jms.stale-filter.persistence-enabled=true
org.coldis.library.service.jms.stale-filter.create-schema=true
org.coldis.library.service.jms.stale-filter.table-name=stale_message_filter
org.coldis.library.service.jms.stale-filter.initial-capacity=4096

# Spring AOP.
spring.aop=false
spring.aop.auto=false

# Transaction configuration.
org.coldis.library.service.transaction.shortest-timeout=1
org.coldis.library.service.transaction.shorter-timeout=2
org.coldis.library.service.transaction.short-timeout=3
org.coldis.library.service.transaction.regular-timeout=5
org.coldis.library.service.transaction.long-timeout=13
org.coldis.library.service.transaction.longer-timeout=30
org.coldis.library.service.transaction.longest-timeout=200
org.coldis.library.service.transaction.minutes-timeout=600
org.coldis.library.service.transaction.hour-timeout=3600
org.coldis.library.service.transaction.hours-timeout=10800
spring.transaction.default-timeout=${org.coldis.library.service.transaction.regular-timeout:5}

# JMS/Artemis.
spring.jms.cache.enabled=false
spring.artemis.broker-url-query-default=remotingThreads=${AVAILABLE_CPUS_30X:100};useEpoll=false;directDeliver=false;tcpNoDelay=true;batchDelay=0;tcpSendBufferSize=-1;tcpReceiveBufferSize=-1;writeBufferLowWaterMark=65536;writeBufferHighWaterMark=8388608;useTopologyForLoadBalancing=false;
spring.artemis.mode=native
spring.artemis.use-global-pools=true
spring.artemis.cache-destinations=true
spring.artemis.cache-large-messages-client=false
spring.artemis.compress-large-message=false
spring.artemis.compression-level=-1
spring.artemis.consumer-max-rate=-1
spring.artemis.producer-window-size=65536
spring.artemis.producer-max-rate=-1
spring.artemis.confirmation-window-size=1048576
spring.artemis.ack-batch-size=65536
spring.artemis.dups-ack-batch-size=131072
spring.artemis.block-on-acknowledge=false
spring.artemis.block-on-durable-send=true
spring.artemis.block-on-non-durable-send=false
spring.artemis.client-failure-check-period=20000
spring.artemis.connection-ttl=120000
spring.artemis.call-timeout=20000
spring.artemis.call-failover-timeout=10000
spring.artemis.reconnect-attempts=-1
spring.artemis.retry-interval=3000
spring.artemis.retry-interval-multiplier=1.5
spring.artemis.max-messages-per-task=10
spring.artemis.backoff-initial-interval=3000
spring.artemis.backoff-multiplier=1
spring.artemis.backoff-max-elapsed-time=9223372036854775807
spring.artemis.cache-level=3
spring.artemis.embedded.enabled=false
spring.artemis.pool.enabled=true
spring.artemis.pool.idle-timeout=60s
spring.artemis.pool.max-connections=16
spring.artemis.pool.max-sessions-per-connection=500
spring.artemis.pool.block-if-full=true
spring.artemis.pool.block-if-full-timeout=-1
spring.artemis.pool.time-between-expiration-check=60s
spring.artemis.pool.use-anonymous-producers=true

# Dynamic consumer credit scaling enabled by default. The scaling signal is each
# consumer's fair share of the backlog (depth / consumers on the queue): above the
# threshold the consumer's prefetch window grows with its share (up to max-credits,
# a per-consumer cap) so deep queues drain with larger batches; at or below it
# credits pass through unchanged (one message at a time, fair distribution), and
# over-inflated windows decay back once the backlog shrinks.
# Each value can be overridden by an env var.
spring.artemis.consumer-window-size=0
spring.artemis.dynamic-credits-depth-threshold=200
spring.artemis.dynamic-credits-multiplier=2.0
spring.artemis.dynamic-credits-max-credits=131072
spring.artemis.dynamic-credits-cache-ttl=5000

# Log.
logging.config-timeout=classpath:logback-spring.xml
logging.file.max-history=10
logging.file.max-size=250MB
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.org.coldis=INFO

# Tomcat.
server.max-http-request-header-size=256KB
server.tomcat.acceptor-thread-priority=5
server.tomcat.use-virtual-threads=false
server.tomcat.max-swallow-size=5MB
server.tomcat.max-http-form-post-size=5MB
server.tomcat.mbeanregistry.enabled=true
server.tomcat.connection-timeout=20s
server.tomcat.keep-alive-timeout=20s
server.tomcat.max-keep-alive-requests=4096
server.tomcat.accept-count=8192
server.tomcat.max-connections=16384
server.tomcat.threads.min-spare=${AVAILABLE_CPUS_1X:8}
server.tomcat.threads.max=${AVAILABLE_CPUS_5X:16}
# Floor for the default server.tomcat.threads.max above: when the cap comes from this file, a
# value below the floor is raised to it. A cap the service sets itself (in its own properties or
# as SERVER_TOMCAT_THREADS_MAX) is used as is. Requests mostly wait on the database and on other
# services, so with only a few threads a slow dependency holds them all, and the health check
# and the /properties updates queue behind it. 0 turns the floor off.
org.coldis.library.service.tomcat.threads.max-floor=20
server.tomcat.processor-cache=20000

# Data cache.
org.coldis.configuration.cache.millis-expiration=3100
org.coldis.configuration.cache.seconds-expiration=23
org.coldis.configuration.cache.minutes-expiration=11
org.coldis.configuration.cache.hours-expiration=3
org.coldis.configuration.cache.day-expiration=1
org.coldis.configuration.cache.days-expiration=5
# Local (in-process, Caffeine) caching: on by default in every service. false turns it off: methods cached with a
# local cache manager are then called every time.
org.coldis.configuration.cache.local.enabled=true
# Maximum entries of each local cache (per cache name, per local cache manager, and per central cache name when the
# central fallback is local), org.coldis.configuration.cache.local.maximum-size: unset (the default) or not positive
# leaves local caches unbounded, limited by their expiration only, as before local caching was on by default.
# What the central cache managers (*ExpirationCentralCacheManager) resolve to in a service without Redis caching
# (no spring-boot-starter-data-redis): none (no caching, the methods are called every time) or local (an in-process
# cache with the central expirations). A service with Redis keeps its Redis cache managers either way. With local,
# an eviction clears one instance only: do not use it for anything that is revoked (tokens, permissions).
org.coldis.configuration.cache.central.fallback=none
# Local cache stats and metrics. The local caches (and the local central fallback) record stats (Caffeine's
# recordStats) and, when the service has a Micrometer meter registry (any backend), publish them per cache as each
# cache is created: cache.gets{result=hit|miss}, cache.evictions, cache.eviction.weight, cache.size and cache.puts
# (Caffeine loads: only @Cacheable(sync = true) methods count there, and only with local single-flight off), tagged cache=<cache name> and
# cache.manager=<cache manager bean name>: 6 series per cache. metrics-enabled=false
# keeps the stats (for the debug log) without publishing them; record-stats=false turns off both, and the debug log.
org.coldis.configuration.cache.local.record-stats=true
org.coldis.configuration.cache.local.metrics-enabled=true
# Central (Redis) cache connection pool: on by default when org.apache.commons:commons-pool2 is on the class path
# (without it, the one shared Lettuce connection stays). On, each command borrows one of up to max-total connections
# (Redis then sees max-total connections per instance), so Redis I/O threads can engage; enabled=false goes back to one
# shared connection. Defaults: max-total 8, max-idle 8, min-idle 0, max-wait 1s (a command that waits longer for a
# connection fails). These take precedence over spring.data.redis.lettuce.pool.*.
org.coldis.configuration.cache.central.pool.enabled=true
#org.coldis.configuration.cache.central.pool.max-total=8
#org.coldis.configuration.cache.central.pool.max-idle=8
#org.coldis.configuration.cache.central.pool.min-idle=0
#org.coldis.configuration.cache.central.pool.max-wait=1s
# Single-flight loads of synchronized cached methods (@Cacheable(sync = true) only: plain @Cacheable methods are not
# affected, and a hit is the same single cache read as before). On a miss, one thread per instance loads the key and
# the other threads asking for the same key wait for that load and get its value or its exception; threads asking for
# other keys never wait, and no lock or Redis connection is held while a load runs (local loads run outside Caffeine's
# compute, so a load may call another synchronized method of the same cache). A thread that waits longer than
# wait-timeout loads the key by itself. Without single-flight, central (Redis) synchronized loads are not deduplicated
# and run holding a Redis connection, and local ones run inside Caffeine's compute (holding a hash-bin lock). Local
# single-flight also applies to the local central fallback. With it, Caffeine's cache.puts (loads) stays at zero.
# wait-timeout must be well above the slowest synchronized load (a waiter that gives up loads the key once more). An
# eviction or a clear that runs during a synchronized load wins: the load returns its value to its callers but does not
# keep it in the cache (for central caches, only evictions through the same instance are seen).
org.coldis.configuration.cache.local.single-flight.enabled=true
org.coldis.configuration.cache.central.single-flight.enabled=true
org.coldis.configuration.cache.single-flight.wait-timeout=120s
# Central cross-instance lock: off by default (single-flight alone adds no Redis command). On, the instance that loads
# a key of a central cache holds a Redis lock on it (SET NX PX lock.timeout, released after the put), so only one
# instance loads it; the others read the key (and try the lock again) every poll-interval until it appears, and after
# wait-timeout load it by themselves. The threads that wait for a load in the same instance wait up to
# lock.timeout + wait-timeout. lock.timeout is the longest a load is expected to take: a lock left by an
# instance that dies while loading lasts that long at most.
org.coldis.configuration.cache.central.single-flight.lock.enabled=false
org.coldis.configuration.cache.central.single-flight.lock.timeout=60s
org.coldis.configuration.cache.central.single-flight.lock.poll-interval=100ms

# Virtual threads.
spring.threads.virtual.enabled=false

# Lazy initialization and keep alive.
spring.main.lazy-initialization=false
spring.main.keep-alive=true

# Actuator.
management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=env,beans
# Server request latency histogram (vendor neutral, Micrometer): http.server.requests publishes cumulative counts of
# requests at or under each of these service level objectives, so the backend can compute the share of requests under
# a target and percentiles (p95, p99) by interpolation. Fixed objectives instead of the percentiles histogram (about
# 70 buckets) keep the series low: each request series (method, uri, status, outcome, exception) gains one series per
# objective plus one for infinity, 9 on top of today's 3 (count, sum, max), so about 4 times the current
# http.server.requests series. The objectives run from 50ms (a cached or indexed read) to 10s (above the regular 5s
# transaction timeout). A service overrides the list, or turns it off with an empty value:
# management.metrics.distribution.slo.http.server.requests=
# Not for http.server.requests.active (a long task timer the prefix would also match) nor for http.client.requests.
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s,5s,10s
management.metrics.distribution.slo.http.server.requests.active=

# OpenAPI. Disabled by default.
springdoc.swagger-ui.enabled=false

# File.
org.coldis.configuration.file.date.suffix=yyyyMMddHHmmss

